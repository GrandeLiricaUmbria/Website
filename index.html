<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grande Lirica Umbria — Sito in costruzione</title>
<meta name="description" content="Il nuovo sito di Grande Lirica Umbria APS è in preparazione. Stagione 2026–2027.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F4EC">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="assets/fonts/playfair.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/playfair.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/spectral.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/oswald.woff2) format('woff2')}
:root{
  --paper:#F7F4EC;--ink-900:#0E0D0B;--ink-700:#2E2B25;--ink-600:#4A463F;
  --gold-700:#87701F;--gold-600:#A2862A;
  --border-hairline:rgba(14,13,11,.14);--border-hairline-strong:rgba(14,13,11,.28);
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-text:'Spectral',Georgia,'Times New Roman',serif;
  --font-condensed:'Oswald','Arial Narrow',sans-serif;
  --gutter:clamp(20px,5vw,64px);--section-y:clamp(56px,7vw,96px);--page-max:1320px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink-900)}
p,h1{margin:0}
main{min-height:100vh;display:flex;flex-direction:column;padding:0 var(--gutter)}
header,section,footer{width:100%;max-width:var(--page-max);margin:0 auto}
header{padding-top:32px;display:flex;justify-content:center}
header img{display:block;height:112px;width:auto}
section{flex:1;display:flex;align-items:center;padding:var(--section-y) 0}
.block{width:100%;max-width:820px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
.eyebrow{font-family:var(--font-condensed);font-size:14px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold-700)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(3.25rem,8vw,6.5rem);line-height:.96;letter-spacing:-.02em;text-wrap:balance}
.lead{font-family:var(--font-text);font-weight:400;font-size:19px;line-height:1.55;max-width:44ch;text-wrap:pretty;color:var(--ink-700)}
footer{border-top:1px solid var(--border-hairline);padding:24px 0 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;font-family:var(--font-condensed);font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-600)}
a{color:var(--ink-900);text-decoration:none;border-bottom:1px solid var(--border-hairline-strong);transition:color 160ms,border-color 160ms}
a:hover{color:var(--gold-700);border-bottom-color:var(--gold-600)}
a:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--gold-600)}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <picture>
      <source srcset="assets/logo.webp" type="image/webp">
      <img src="assets/logo.png" width="91" height="112" alt="Grande Lirica Umbria">
    </picture>
  </header>
  <section>
    <div class="block">
      <p class="eyebrow">Sito in costruzione · Stagione 2026–2027</p>
      <h1>Il sipario si alza a breve</h1>
      <p class="lead">Siamo alle ultime prove:<br>il nuovo sito di Grande Lirica Umbria debutta a breve.</p>
    </div>
  </section>
  <footer>
    <span>Grande Lirica Umbria APS · Ponte San Giovanni&nbsp;(PG)</span>
    <a href="mailto:comunicazione@grandeliricaumbria.it">comunicazione@grandeliricaumbria.it</a>
  </footer>
</main>
</body>
</html>
